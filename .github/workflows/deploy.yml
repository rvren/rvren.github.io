name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild daily so the shelf's commit trend (src/data/activity.json) stays current.
  schedule:
    - cron: "17 6 * * *"

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACTIVITY_TOKEN: ${{ secrets.ACTIVITY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fresh commit snapshot for the shelf. Several product repos are private, so this
      # needs ACTIVITY_TOKEN: a fine-grained token with read-only Contents + Metadata on
      # those repos. Without it, or if GitHub's stats are not ready, the committed
      # snapshot is used, and the site stops claiming activity once that is 30 days old.
      - name: Refresh commit activity
        if: ${{ env.ACTIVITY_TOKEN != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ACTIVITY_TOKEN }}
        run: npm run activity

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
