<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="plinth">
  <!-- App tile for the portfolio: plinth's own mark (docs/brand/plinth-mark-dark.svg in
       rvren/plinth) on an ink tile. Geometry unchanged, scaled into the tile. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#15111f"/>
  <g transform="translate(12 12) scale(1.25)">
    <rect x="14" y="4.5" width="12" height="5" rx="2.5" fill="url(#g)"/>
    <rect x="6" y="11" width="16" height="5" rx="2.5" fill="url(#g)" fill-opacity="0.78"/>
    <rect x="10" y="17.5" width="15" height="5" rx="2.5" fill="url(#g)" fill-opacity="0.56"/>
    <rect x="2" y="24" width="28" height="5" rx="2.5" fill="#ededed"/>
  </g>
</svg>
