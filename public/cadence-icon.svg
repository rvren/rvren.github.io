<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252A38" />
      <stop offset="55%" stop-color="#161A24" />
      <stop offset="100%" stop-color="#0C0E16" />
    </linearGradient>
    <radialGradient id="topglow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="dotglow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="12" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- squircle background -->
  <rect x="82" y="82" width="860" height="860" rx="198" fill="url(#bg)" />
  <rect x="82" y="82" width="860" height="860" rx="198" fill="url(#topglow)" />
  <rect x="83.5" y="83.5" width="857" height="857" rx="196.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.06" stroke-width="3" />

  <!-- faint track ring -->
  <circle cx="512" cy="512" r="270" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="74" />

  <!-- bright progress arc (~72%) starting at top, clockwise -->
  <g transform="rotate(-90 512 512)" filter="url(#softglow)">
    <circle cx="512" cy="512" r="270" fill="none" stroke="url(#arc)" stroke-width="74"
            stroke-linecap="round" stroke-dasharray="1221.4 475.1" />
  </g>

  <!-- leading "beat" dot at the arc head -->
  <circle cx="247" cy="562" r="24" fill="#ffffff" filter="url(#dotglow)" />

  <!-- centre: "C" monogram (Cadence) -->
  <path d="M 580.8 413.7 A 120 120 0 1 0 580.8 610.3"
        fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round" />
</svg>
