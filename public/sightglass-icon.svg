<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Sightglass. On a pipe or a tank, a sightglass is the small window you look
    through to read the level inside — the instrument that makes an opaque
    system legible. That is the whole product in one object, so the mark is the
    object and nothing else: a circle you look through, and the level you read
    off it.

    Derived from brand/mark.svg (the in-app mark), scaled to the macOS icon
    grid. Deliberately austere — there is nothing here small enough to be lost
    at 16px in the Dock.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252A38" />
      <stop offset="55%" stop-color="#161A24" />
      <stop offset="100%" stop-color="#0C0E16" />
    </linearGradient>
    <radialGradient id="topglow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- The level carries the colour: it is the part that means something. -->
    <!-- userSpaceOnUse, spanning only the chord that is actually visible: an
         objectBoundingBox sweep put the sky end in the clipped corner and the
         level read as flat indigo. -->
    <linearGradient id="level" gradientUnits="userSpaceOnUse"
                    x1="250" y1="640" x2="774" y2="810">
      <stop offset="0%" stop-color="#7A67F0" />
      <stop offset="52%" stop-color="#5343D6" />
      <stop offset="100%" stop-color="#3F72E8" />
    </linearGradient>

    <!-- Glass: a cool sheen down the ring so it reads as a lens, not a hoop. -->
    <linearGradient id="glass" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#C7CEDB" />
    </linearGradient>

    <clipPath id="bore"><circle cx="512" cy="512" r="272" /></clipPath>

    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- squircle background -->
  <rect x="82" y="82" width="860" height="860" rx="198" fill="url(#bg)" />
  <rect x="82" y="82" width="860" height="860" rx="198" fill="url(#topglow)" />
  <rect x="83.5" y="83.5" width="857" height="857" rx="196.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.06" stroke-width="3" />

  <!-- What's below the level, seen through the glass. -->
  <g clip-path="url(#bore)" filter="url(#softglow)">
    <rect x="220" y="628" width="584" height="200" fill="url(#level)" />
    <!-- The meniscus: one flat highlight on the surface. A straight line reads
         as an instrument reading; a wave would read as an illustration. -->
    <rect x="220" y="628" width="584" height="7" fill="#ffffff" fill-opacity="0.5" />
  </g>

  <!-- The glass itself. -->
  <circle cx="512" cy="512" r="272" fill="none" stroke="url(#glass)" stroke-width="71" />
  <!-- Inner lip — a hairline of depth where the bore meets the ring. -->
  <circle cx="512" cy="512" r="237" fill="none" stroke="#000000" stroke-opacity="0.22" stroke-width="6" />
</svg>
